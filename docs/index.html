<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How okflify works — a bundle that is its own documentation · okflify</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
:root{
  --p:#2E6F5E; --pl:#6FC7AC; --pd:#1F5044;
  --bg:#fff; --raise:#fafafa; --ink:#18181b; --ink2:#3f3f46; --mut:#71717a; --faint:#a1a1aa;
  --line:#e8e8eb; --line2:#f4f4f5; --acc:var(--p); --accbg:color-mix(in srgb,var(--p) 8%,transparent);
  --human:#15803d; --job:#b45309; --agent:#8b8b93;
  --r:12px; --sh:0 1px 3px rgba(0,0,0,.04),0 8px 24px -8px rgba(0,0,0,.06);
  --fb:"Inter",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --fh:"Inter",var(--fb);
}
html[data-t="dark"]{
  --bg:#09090b; --raise:#111113; --ink:#fafafa; --ink2:#c8c8ce; --mut:#8b8b93; --faint:#63636b;
  --line:#232326; --line2:#161619; --acc:var(--pl); --accbg:color-mix(in srgb,var(--pl) 11%,transparent);
  --human:#4ade80; --job:#fbbf24; --agent:#8b8b93;
  --sh:0 1px 3px rgba(0,0,0,.5),0 8px 28px -10px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink2);font:400 16px/1.75 var(--fb);
 -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
::selection{background:var(--accbg);color:var(--ink)}
a{color:var(--acc);text-decoration:none}
svg{flex:none}

/* decoration */
body::before{content:"";position:fixed;inset:0 0 auto;height:340px;pointer-events:none;z-index:0;
 background:radial-gradient(70% 100% at 50% 0%,color-mix(in srgb,var(--p) 9%,transparent),transparent 72%)}
html[data-decor="grid"] body::before{
 background:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);
 background-size:44px 44px;height:100%;opacity:.55;mask-image:linear-gradient(#000,transparent 55%)}
html[data-decor="none"] body::before{display:none}

/* top bar */
header{position:sticky;top:0;z-index:40;height:60px;flex:none;display:flex;align-items:center;
 gap:1rem;padding:0 1.6rem;border-bottom:1px solid var(--line);
 background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.8) blur(14px)}
.logo{display:flex;align-items:center;gap:.55rem;font:600 .95rem/1 var(--fh);color:var(--ink);
 letter-spacing:-.018em;white-space:nowrap}
.mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(140deg,var(--p),var(--pl));
 display:grid;place-items:center;color:#fff;font:700 11px/1 var(--fb)}
.ver{font:500 .66rem/1 ui-monospace,monospace;color:var(--acc);background:var(--accbg);
 padding:.3rem .5rem;border-radius:99px;letter-spacing:.03em;white-space:nowrap}
.grow{flex:1}
.srch{position:relative;width:270px;max-width:34vw}
.srch input{width:100%;height:34px;padding:0 .7rem 0 2.1rem;font:inherit;font-size:.84rem;
 background:var(--raise);border:1px solid var(--line);border-radius:9px;color:var(--ink);transition:.15s}
.srch input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg);background:var(--bg)}
.srch svg{position:absolute;left:.65rem;top:9px;color:var(--faint)}
.ib{height:34px;padding:0 .7rem;display:inline-flex;align-items:center;gap:.35rem;font:500 .8rem/1 var(--fb);
 border:1px solid var(--line);background:var(--raise);color:var(--ink2);border-radius:9px;cursor:pointer;transition:.15s}
.ib:hover{border-color:var(--acc);color:var(--acc)}

.shell{flex:1;display:flex;min-height:0;position:relative;z-index:1}

/* sidebar — deliberately clean: no badges per row */
aside{width:266px;flex:none;padding:1.9rem 1rem 5rem 1.6rem;overflow-y:auto;
 height:calc(100vh - 60px);position:sticky;top:60px;scrollbar-width:thin}
.sec{display:flex;align-items:center;gap:.5rem;margin:1.7rem 0 .5rem;color:var(--ink);
 font:600 .8rem/1 var(--fb);letter-spacing:-.01em}
.sec:first-child{margin-top:0}
.sec svg{color:var(--mut)}
aside a.n{display:block;padding:.35rem .6rem;margin-left:.15rem;border-radius:7px;color:var(--mut);
 font-size:.875rem;line-height:1.5;transition:color .13s,background .13s}
aside a.n:hover{color:var(--ink);background:var(--line2)}
aside a.n.on{color:var(--acc);font-weight:550;background:var(--accbg)}
.empty{padding:.4rem .6rem;color:var(--faint);font-size:.82rem}

/* content */
main{flex:1;min-width:0;overflow-y:auto;height:calc(100vh - 60px);scroll-behavior:smooth}
.cols{display:flex;gap:3rem;max-width:74rem;margin:0 auto;padding:2.8rem 3rem 9rem;align-items:flex-start}
.body{flex:1;min-width:0;max-width:44rem}
.rail{width:186px;flex:none;position:sticky;top:1rem;font-size:.8rem;
 max-height:calc(100vh - 9rem);overflow-y:auto;overflow-x:hidden}
.rail .rh{display:flex;gap:.45rem;align-items:center;color:var(--ink);font:600 .78rem/1 var(--fb);margin-bottom:.75rem}
.rail a{display:flex;gap:.5rem;align-items:baseline;padding:.26rem 0;color:var(--mut);
 line-height:1.45;transition:color .13s;overflow-wrap:anywhere;hyphens:auto}
.rail a::before{content:"";width:5px;height:5px;border-radius:50%;background:transparent;flex:none;transform:translateY(-1px)}
.rail a:hover{color:var(--ink)}
.rail a.here{color:var(--acc)} .rail a.here::before{background:var(--acc)}
.rail a.l3{padding-left:.95rem;font-size:.765rem}

.doc{display:none;animation:fi .24s ease}
.doc.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.eyebrow{color:var(--acc);font:550 .82rem/1 var(--fb);letter-spacing:-.005em;margin-bottom:.7rem}

/* prose — Mintlify weights: light headings, roomy body */
h1{font:600 2.45rem/1.15 var(--fh);letter-spacing:-.038em;color:var(--ink);margin:0 0 .55rem}
h2{font:600 1.5rem/1.3 var(--fh);letter-spacing:-.025em;color:var(--ink);margin:3.2rem 0 .9rem;scroll-margin-top:2rem}
h3{font:600 1.13rem/1.4 var(--fh);letter-spacing:-.016em;color:var(--ink);margin:2.2rem 0 .6rem;scroll-margin-top:2rem}
h4{font:600 .95rem/1.5 var(--fb);color:var(--ink);margin:1.6rem 0 .4rem}
p{margin:.95rem 0;color:var(--ink2);font-size:1rem}
strong{color:var(--ink);font-weight:600}
.body>p:first-of-type,.eyebrow+h1+p{font-size:1.08rem;color:var(--mut)}
ul,ol{margin:.85rem 0;padding-left:1.3rem}
li{margin:.38rem 0;color:var(--ink2)}li::marker{color:var(--faint)}
hr{border:0;border-top:1px solid var(--line);margin:2.6rem 0}
code{font:.86em ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--line2);color:var(--ink);
 padding:.15em .4em;border-radius:5px;border:1px solid var(--line)}
pre{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:1.05rem 1.2rem;
 overflow-x:auto;font-size:.82rem;line-height:1.7;box-shadow:var(--sh);margin:1.3rem 0}
pre code{background:none;border:0;padding:0}
.tw{overflow-x:auto;margin:1.4rem 0;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;font-size:.87rem}
th,td{padding:.68rem .95rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)}
th{background:var(--raise);color:var(--ink);font:600 .74rem/1.5 var(--fb);text-transform:uppercase;
 letter-spacing:.06em;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--line2)}
.mermaid{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:1.5rem;
 margin:1.6rem 0;text-align:center;overflow-x:auto;box-shadow:var(--sh)}
/* mermaid emits an inline max-width at the diagram's natural size, which is
   often far narrower than the column — the result is unreadably small. Let it
   fill the column; the lightbox handles anything still too dense. */
.mermaid svg{width:100%!important;max-width:100%!important;height:auto}

/* callouts */
.cal{display:flex;gap:.75rem;padding:.95rem 1.1rem;border-radius:var(--r);margin:1.4rem 0;
 border:1px solid;font-size:.93rem;line-height:1.65}
.cal p{margin:.25rem 0;color:inherit}.cal p:first-child{margin-top:0}.cal p:last-child{margin-bottom:0}
.cal .ci{width:17px;height:17px;flex:none;margin-top:.22rem}
.cal-note{background:color-mix(in srgb,#3b82f6 7%,transparent);border-color:color-mix(in srgb,#3b82f6 24%,transparent);color:var(--ink2)}
.cal-note .ci{color:#3b82f6}
.cal-info{background:color-mix(in srgb,#8b5cf6 7%,transparent);border-color:color-mix(in srgb,#8b5cf6 24%,transparent);color:var(--ink2)}
.cal-info .ci{color:#8b5cf6}
.cal-tip{background:color-mix(in srgb,#14b8a6 7%,transparent);border-color:color-mix(in srgb,#14b8a6 24%,transparent);color:var(--ink2)}
.cal-tip .ci{color:#14b8a6}
.cal-check{background:color-mix(in srgb,#22c55e 8%,transparent);border-color:color-mix(in srgb,#22c55e 26%,transparent);color:var(--ink2)}
.cal-check .ci{color:#22c55e}
.cal-warn{background:color-mix(in srgb,#f59e0b 9%,transparent);border-color:color-mix(in srgb,#f59e0b 28%,transparent);color:var(--ink2)}
.cal-warn .ci{color:#f59e0b}
.cal-danger{background:color-mix(in srgb,#ef4444 8%,transparent);border-color:color-mix(in srgb,#ef4444 28%,transparent);color:var(--ink2)}
.cal-danger .ci{color:#ef4444}

/* trust */
.trust{border:1px solid var(--line);border-radius:var(--r);background:var(--raise);box-shadow:var(--sh);
 padding:.9rem 1.1rem;margin:0 0 2.4rem;font-size:.83rem}
.trust .hd{display:flex;align-items:center;gap:.5rem;margin-bottom:.55rem;
 font:600 .72rem/1 var(--fb);text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.human{background:var(--human)}.dot.job{background:var(--job)}.dot.agent{background:var(--agent)}
.trust dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.22rem .95rem}
.trust dt{color:var(--faint);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;line-height:1.85}
.trust dd{margin:0;color:var(--ink2);font:.76rem/1.7 ui-monospace,monospace}
.trust .fl{margin-top:.7rem;padding-top:.7rem;border-top:1px dashed var(--line);
 color:var(--mut);font:.8rem/1.6 var(--fb)}

/* relations */
.rel{margin-top:3.4rem;padding-top:1.8rem;border-top:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:.8rem;margin:.8rem 0 1.6rem}
.card{display:block;padding:.85rem 1rem;border:1px solid var(--line);border-radius:var(--r);
 background:var(--raise);transition:.16s}
.card:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:var(--sh)}
.card .t{color:var(--ink);font:550 .875rem/1.4 var(--fb);margin-bottom:.3rem}
.card .m{display:flex;gap:.4rem;align-items:center;color:var(--faint);font-size:.72rem}

/* graph */
#gw{border:1px solid var(--line);border-radius:var(--r);background:var(--raise);box-shadow:var(--sh);
 overflow:hidden;margin:1.6rem 0}
#graph{display:block;width:100%;height:540px;cursor:grab}#graph:active{cursor:grabbing}
#graph .link{stroke:var(--line);stroke-width:1.5}
#graph .node circle{stroke:var(--bg);stroke-width:2.5;cursor:pointer}
#graph .node text{font:500 11px var(--fb);fill:var(--mut);pointer-events:none;user-select:none}
.gl{display:flex;gap:1.2rem;flex-wrap:wrap;padding:.75rem 1.1rem;border-top:1px solid var(--line);
 font-size:.75rem;color:var(--mut);background:var(--bg)}
.gl span{display:flex;gap:.4rem;align-items:center}



/* ── command palette ───────────────────────────────────────── */
#cmdk{position:fixed;inset:0;z-index:300;display:none;background:rgba(0,0,0,.42);backdrop-filter:blur(3px)}
#cmdk.on{display:block}
#cmdbox{position:absolute;left:50%;top:15vh;transform:translateX(-50%);width:min(620px,92vw);
 background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 70px -12px rgba(0,0,0,.4);overflow:hidden}
#cmdin{width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);
 font:400 1.02rem/1 var(--fb);padding:1.05rem 1.15rem;outline:0}
#cmdlist{max-height:52vh;overflow-y:auto;padding:.4rem}
.cmdi{display:flex;gap:.7rem;align-items:baseline;padding:.55rem .75rem;border-radius:8px;cursor:pointer}
.cmdi.sel{background:var(--accbg)}
.cmdi .ct{color:var(--ink);font-size:.9rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdi.sel .ct{color:var(--acc);font-weight:550}
.cmdi .cg{color:var(--faint);font-size:.72rem;white-space:nowrap}
.cmdi .cs{color:var(--mut);font-size:.76rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmdfoot{border-top:1px solid var(--line);padding:.5rem .9rem;color:var(--faint);font-size:.72rem;display:flex;gap:.9rem}
#cmdfoot kbd{font:600 .66rem/1 ui-monospace,monospace;background:var(--line2);border:1px solid var(--line);
 border-radius:4px;padding:.14em .34em;color:var(--ink2)}
.cmdempty{padding:1.4rem;color:var(--faint);font-size:.86rem;text-align:center}

/* ── copy page menu ────────────────────────────────────────── */
.titlerow{display:flex;align-items:flex-start;gap:1.5rem;position:relative;margin-bottom:1.6rem}
.titlerow h1{flex:1;min-width:0;margin:0}
.titlerow .pgacts{flex:none;margin-top:.55rem}
.pgacts{display:flex;position:relative;z-index:6}
.pgbtn{height:34px;padding:0 .7rem;display:inline-flex;align-items:center;gap:.4rem;font:500 .8rem/1 var(--fb);
 border:1px solid var(--line);background:var(--raise);color:var(--ink2);cursor:pointer;transition:.14s}
.pgbtn:first-child{border-radius:9px 0 0 9px}
.pgbtn:last-child{border-radius:0 9px 9px 0;border-left:0;padding:0 .45rem}
.pgbtn:hover{color:var(--acc);border-color:var(--acc)}
.pgmenu{position:absolute;right:0;top:42px;width:300px;background:var(--bg);border:1px solid var(--line);
 border-radius:12px;box-shadow:0 18px 50px -12px rgba(0,0,0,.35);padding:.35rem;display:none;z-index:7}
.pgmenu.on{display:block}
.pgmenu button{display:flex;gap:.7rem;align-items:flex-start;width:100%;text-align:left;border:0;
 background:none;padding:.55rem .6rem;border-radius:8px;cursor:pointer;color:var(--ink)}
#pgmenu button:hover{background:var(--line2)}
.pgmenu .mi{width:26px;height:26px;flex:none;display:grid;place-items:center;border:1px solid var(--line);
 border-radius:7px;color:var(--mut);background:var(--raise)}
.pgmenu .mt{display:block;font:550 .845rem/1.35 var(--fb)}
.pgmenu .md{display:block;font:400 .745rem/1.4 var(--fb);color:var(--faint);margin-top:.15rem}
.docwrap{position:relative}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);opacity:0;
 background:var(--ink);color:var(--bg);font:550 .82rem/1 var(--fb);padding:.6rem .95rem;border-radius:9px;
 z-index:400;pointer-events:none;transition:.2s;box-shadow:var(--sh)}
#toast.on{opacity:1;transform:translateX(-50%)}

/* ── code copy ─────────────────────────────────────────────── */
.pre-w{position:relative}
.pre-w>.cpy{position:absolute;top:.5rem;right:.5rem;width:28px;height:28px;display:grid;place-items:center;
 border:1px solid var(--line);background:var(--bg);color:var(--mut);border-radius:7px;cursor:pointer;
 opacity:0;transition:.14s}
.pre-w:hover>.cpy{opacity:1}
.pre-w>.cpy:hover{color:var(--acc);border-color:var(--acc)}
@media print{#cmdk,.pgacts,.pgmenu,#toast,.cpy{display:none!important}}


/* ── tree view ─────────────────────────────────────────────── */
.tree{font-size:.9rem;margin:1.2rem 0}
.tnode{border-left:1px solid var(--line);margin-left:.55rem;padding-left:.9rem}
.tbundle{margin:.15rem 0}
.tsum{display:flex;align-items:center;gap:.5rem;padding:.34rem .5rem;border-radius:7px;cursor:pointer;
 color:var(--ink);user-select:none}
.tsum:hover{background:var(--line2)}
.tsum .car{transition:transform .15s;color:var(--faint);flex:none}
details[open]>.tsum .car{transform:rotate(90deg)}
.tsum .nm{font-weight:560;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsum .ct{font:500 .7rem/1 ui-monospace,monospace;color:var(--faint);flex:none}
.tsec{font:600 .68rem/1 var(--fb);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);
 margin:.6rem 0 .25rem .5rem}
a.tleaf{display:flex;align-items:center;gap:.5rem;padding:.3rem .5rem;border-radius:6px;color:var(--mut);
 text-decoration:none;line-height:1.4}
a.tleaf:hover{background:var(--line2);color:var(--ink)}
a.tleaf .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.tleaf .tk{font:500 .66rem/1 ui-monospace,monospace;color:var(--faint);flex:none}
.tbar{display:flex;gap:.5rem;margin:1rem 0}

/* ── lightbox: Adobe-style diagram surfing ─────────────────── */
.mermaid,figure img,.body img{cursor:zoom-in}
#lb{position:fixed;inset:0;z-index:200;display:none;background:color-mix(in srgb,var(--bg) 93%,#000);
 backdrop-filter:blur(6px)}
#lb.on{display:block;animation:fi .16s ease}
#lbstage{position:absolute;inset:0;overflow:hidden;cursor:grab}
#lbstage.grab{cursor:grab}#lbstage.grabbing{cursor:grabbing}
#lbinner{position:absolute;left:50%;top:50%;transform-origin:0 0;will-change:transform;
 transition:transform .09s cubic-bezier(.22,.61,.36,1)}
#lbinner.free{transition:none}
#lbinner svg,#lbinner img{display:block;max-width:none;height:auto;filter:drop-shadow(0 12px 40px rgba(0,0,0,.28))}
#lbbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:.3rem;
 align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:11px;
 padding:.34rem .4rem;box-shadow:var(--sh);z-index:2}
#lbbar button{width:30px;height:28px;display:grid;place-items:center;border:0;background:none;
 color:var(--mut);border-radius:7px;cursor:pointer;font:600 .78rem/1 var(--fb)}
#lbbar button:hover{background:var(--line2);color:var(--ink)}
#lbpct{min-width:52px;text-align:center;font:600 .74rem/1 ui-monospace,monospace;color:var(--ink);
 padding:0 .2rem;cursor:default}
#lbsep{width:1px;height:18px;background:var(--line);margin:0 .18rem}
#lbclose{position:absolute;top:18px;right:20px;z-index:2;width:34px;height:34px;display:grid;
 place-items:center;border:1px solid var(--line);background:var(--raise);color:var(--mut);
 border-radius:9px;cursor:pointer;box-shadow:var(--sh)}
#lbclose:hover{color:var(--acc);border-color:var(--acc)}
#lbhint{position:absolute;top:18px;left:20px;z-index:2;font:.72rem/1.5 var(--fb);color:var(--faint);
 background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:.42rem .65rem;
 box-shadow:var(--sh);max-width:min(52ch,60vw)}
#lbhint kbd{font:600 .68rem/1 ui-monospace,monospace;background:var(--line2);color:var(--ink2);
 border:1px solid var(--line);border-radius:4px;padding:.14em .34em;margin:0 .1em}
@media print{#lb{display:none!important}}

@media print{
 header,aside,.rail,#gw,.rel{display:none!important}
 body{display:block}body::before{display:none}
 .shell{display:block}main{height:auto;overflow:visible}
 .cols{display:block;max-width:none;padding:0}.body{max-width:none}
 .doc{display:block!important;page-break-after:always;animation:none}
 .doc:last-child{page-break-after:auto}
 pre,table,.mermaid,.trust,.cal{break-inside:avoid}h1,h2,h3,h4{break-after:avoid}
 a{color:inherit}@page{margin:15mm}
}
@media (max-width:1180px){.rail{display:none}.cols{padding:2.4rem}}
@media (max-width:900px){
 .shell{display:block}aside{width:auto;height:auto;position:static;border-bottom:1px solid var(--line);padding:1.2rem 1.4rem}
 main{height:auto}.cols{padding:1.6rem 1.4rem 5rem}.srch{width:170px}
}
</style></head><body>

<header>
  <div class="logo"><span class="mark">A</span>okflify</div>
  <span class="ver">OKF v0.2</span>
  <div class="grow"></div>
  <div class="srch">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    <input id="q" type="search" placeholder="Search documentation…" autocomplete="off">

const DOCS=[{"slug": "index", "bundle": "", "group": "Bundle", "section": "Bundle", "file": "index.md", "title": "How okflify works \u2014 a bundle that is its own documentation", "type": "investigation", "status": "open", "tags": "[okf, okflify, example, documentation]", "verified": {"by": "job:okflify-build", "at": "2026-07-29", "method": "this page is rendered by the tool it documents \u2014 if okflify breaks, this page does not build"}, "html": "<h2>Question</h2>\n<p>What does an Open Knowledge Format v0.2 bundle look like, and what does okflify do with one?</p>\n<h2>Why it matters</h2>\n<p>OKF is easy to describe and hard to picture. Reading a spec tells you a bundle is</p>\n<p>&quot;markdown files with YAML frontmatter&quot;; it does not tell you what a <strong>trust tier</strong></p>\n<p>buys you, or why the folder tree is the least interesting thing about it.</p>\n<p>So this bundle documents okflify <strong>by being</strong> an okflify bundle. Everything you see</p>\n<p>\u2014 the sidebar, the trust card above this text, the graph, the tree \u2014 is this</p>\n<p>directory, rendered by the tool. There is no separate documentation to drift.</p>\n<h2>Scope</h2>\n<div class='tw'><table><thead><tr><th>In</th><th>Out</th></tr></thead><tbody><tr><td>What a bundle is, what okflify renders</td><td>The full OKF spec \u2014 linked, not restated</td></tr><tr><td>The trust model, because it is the point</td><td>Authoring advice \u2014 write what is true</td></tr></tbody></table></div>\n<h2>Status</h2>\n<ul><li><strong>Now:</strong> ships inside the repo at <code>example/</code>. Build it yourself in one command.</li><li><strong>Next experiment:</strong> point okflify at your own notes and see how thin the link graph is. That number is usually a surprise.</li></ul>\n<h2>Concepts</h2>\n<div class='tw'><table><thead><tr><th>Read</th><th>For</th></tr></thead><tbody><tr><td><a href=\"#what-is-a-bundle\" data-nav=\"what-is-a-bundle\">what-is-a-bundle</a></td><td>The five parts, and which are optional</td></tr><tr><td><a href=\"#trust-tiers\" data-nav=\"trust-tiers\">trust-tiers</a></td><td><code>human: &gt; job: &gt; agent:</code> and why it is the whole point</td></tr><tr><td><a href=\"#graph-not-tree\" data-nav=\"graph-not-tree\">graph-not-tree</a></td><td>Why directories lie about structure</td></tr><tr><td><a href=\"#what-okflify-renders\" data-nav=\"what-okflify-renders\">what-okflify-renders</a></td><td>Every feature, and how to reach it</td></tr></tbody></table></div>\n<h2>Learnings</h2>\n<ul><li><a href=\"#links-are-the-product\" data-nav=\"links-are-the-product\">links-are-the-product</a> \u2014 the lesson that cost the most to learn</li></ul>\n<h2>Evidence index</h2>\n<div class='tw'><table><thead><tr><th>Artifact</th><th>Path</th><th>Role</th></tr></thead><tbody><tr><td>This page</td><td>you are reading it</td><td>The tool renders its own documentation</td></tr><tr><td>Build output</td><td><a href=\"#build-output\" data-nav=\"build-output\"><code>evidence/build-output.md</code></a></td><td>Counts from a real run</td></tr></tbody></table></div>\n<h2>Citations</h2>\n<ul><li>Google <a href=\"https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md\" target=\"_blank\" rel=\"noopener\">OKF spec</a></li><li><a href=\"https://cloud.google.com/blog/products/data-analytics/okf-v0-2-adds-trust-signals\" target=\"_blank\" rel=\"noopener\">OKF v0.2 trust signals</a></li></ul>", "src": "## Question\n\nWhat does an Open Knowledge Format v0.2 bundle look like, and what does okflify do with one?\n\n## Why it matters\n\nOKF is easy to describe and hard to picture. Reading a spec tells you a bundle is\n\"markdown files with YAML frontmatter\"; it does not tell you what a **trust tier**\nbuys you, or why the folder tree is the least interesting thing about it.\n\nSo this bundle documents okflify **by being** an okflify bundle. Everything you see\n\u2014 the sidebar, the trust card above this text, the graph, the tree \u2014 is this\ndirectory, rendered by the tool. There is no separate documentation to drift.\n\n## Scope\n\n| In | Out |\n|----|-----|\n| What a bundle is, what okflify renders | The full OKF spec \u2014 linked, not restated |\n| The trust model, because it is the point | Authoring advice \u2014 write what is true |\n\n## Status\n\n- **Now:** ships inside the repo at `example/`. Build it yourself in one command.\n- **Next experiment:** point okflify at your own notes and see how thin the link graph is. That number is usually a surprise.\n\n## Concepts\n\n| Read | For |\n|------|-----|\n| [what-is-a-bundle](concepts/what-is-a-bundle.md) | The five parts, and which are optional |\n| [trust-tiers](concepts/trust-tiers.md) | `human: > job: > agent:` and why it is the whole point |\n| [graph-not-tree](concepts/graph-not-tree.md) | Why directories lie about structure |\n| [what-okflify-renders](concepts/what-okflify-renders.md) | Every feature, and how to reach it |\n\n## Learnings\n\n- [links-are-the-product](learnings/links-are-the-product.md) \u2014 the lesson that cost the most to learn\n\n## Evidence index\n\n| Artifact | Path | Role |\n|----------|------|------|\n| This page | you are reading it | The tool renders its own documentation |\n| Build output | [`evidence/build-output.md`](evidence/build-output.md) | Counts from a real run |\n\n## Citations\n\n- Google [OKF spec](https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md)\n- [OKF v0.2 trust signals](https://cloud.google.com/blog/products/data-analytics/okf-v0-2-adds-trust-signals)\n", "out": ["build-output", "graph-not-tree", "links-are-the-product", "trust-tiers", "what-is-a-bundle", "what-okflify-renders"], "in": []}, {"slug": "log", "bundle": "", "group": "Bundle", "section": "Bundle", "file": "log.md", "title": "log", "type": "\u2014", "status": "", "tags": "", "verified": {}, "html": "<h1>Investigation log (append-only)</h1>\n<div class='tw'><table><thead><tr><th>When</th><th>Who</th><th>Event</th><th>Concept / learning id</th></tr></thead><tbody><tr><td>2026-07-29</td><td>human:daniel</td><td>Asked for an example bundle shipped inside okflify, reachable from the sidebar</td><td><code>index</code></td></tr><tr><td>2026-07-29</td><td>agent:claude</td><td>Wrote the docs AS a bundle rather than about one \u2014 documentation that cannot drift from the tool</td><td><code>index</code></td></tr><tr><td>2026-07-29</td><td>agent:claude</td><td>Cross-linked the concepts deliberately, after shipping a real bundle whose every edge left the index</td><td><code>links-are-the-product</code></td></tr></tbody></table></div>\n<hr/>\n<h2>Why this bundle exists</h2>\n<p>Documentation about a format tends to drift from the tool that reads it. This</p>\n<p>bundle cannot: it is built by the tool, on every release, and a broken renderer</p>\n<p>means a broken page.</p>\n<p>It is also the smallest honest test. If okflify cannot make four concepts and a</p>\n<p>handful of links legible, it will not survive a hundred.</p>", "src": "# Investigation log (append-only)\n\n| When | Who | Event | Concept / learning id |\n|------|-----|-------|------------------------|\n| 2026-07-29 | human:daniel | Asked for an example bundle shipped inside okflify, reachable from the sidebar | `index` |\n| 2026-07-29 | agent:claude | Wrote the docs AS a bundle rather than about one \u2014 documentation that cannot drift from the tool | `index` |\n| 2026-07-29 | agent:claude | Cross-linked the concepts deliberately, after shipping a real bundle whose every edge left the index | `links-are-the-product` |\n\n---\n\n## Why this bundle exists\n\nDocumentation about a format tends to drift from the tool that reads it. This\nbundle cannot: it is built by the tool, on every release, and a broken renderer\nmeans a broken page.\n\nIt is also the smallest honest test. If okflify cannot make four concepts and a\nhandful of links legible, it will not survive a hundred.\n", "out": [], "in": []}, {"slug": "graph-not-tree", "bundle": "", "group": "Concepts", "section": "Concepts", "file": "concepts/graph-not-tree.md", "title": "OKF is a graph \u2014 the directory tree is storage, not structure", "type": "rule", "status": "", "tags": "[okf, graph, structure]", "verified": {"by": "job:okflify-build", "at": "2026-07-29", "method": "okflify extracts edges from markdown links, not from paths \u2014 the graph on this site is that extraction"}, "html": "<h2>The rule</h2>\n<p>Bundles live in folders, so every renderer reaches for a folder tree. That throws</p>\n<p>away the actual structure: <strong>concepts connect through ordinary markdown links</strong>,</p>\n<p>and the resulting network is richer than any parent-child path.</p>\n<pre class=\"mermaid\">flowchart LR\n  I[&quot;index&quot;] --&gt; B[&quot;what-is-a-bundle&quot;]\n  I --&gt; T[&quot;trust-tiers&quot;]\n  I --&gt; G[&quot;graph-not-tree&quot;]\n  I --&gt; R[&quot;what-okflify-renders&quot;]\n  B --&gt; G\n  G --&gt; R\n  T --&gt; L[&quot;links-are-the-product&quot;]\n  R --&gt; T\n  L --&gt; G</pre>\n<p>Same six files. The tree says <em>&quot;four things in a folder called concepts.&quot;</em> The</p>\n<p>graph says <em>what depends on what.</em></p>\n<h2>Both views, because both are true</h2>\n<p>okflify ships <strong>Knowledge graph</strong> and <strong>Tree</strong> side by side. The graph is the</p>\n<p>semantics; the tree is what you can navigate once a catalogue passes ~50</p>\n<p>documents. Neither replaces the other, and pretending the tree is the meaning is</p>\n<p>the mistake this rule exists to prevent.</p>\n<h2>The uncomfortable corollary</h2>\n<p><strong>If a bundle has no cross-links, okflify shows you a star</strong> \u2014 every edge leaving</p>\n<p><code>index.md</code>, nothing between concepts. A star is not a graph, and no amount of</p>\n<p>force-directed physics makes it one.</p>\n<p>okflify warns on stderr when a multi-document bundle has zero edges. It is</p>\n<p>supposed to be uncomfortable: a star means the concepts were written as chapters,</p>\n<p>not as claims that depend on each other.</p>\n<h2>Counter-cases</h2>\n<ul><li>Small bundles are legitimately star-shaped. Four documents do not owe you a</li></ul>\n<p>  network. The warning is about 30-document bundles that are still stars.</p>\n<ul><li>A dense graph is not automatically good \u2014 links added to look connected are</li></ul>\n<p>  worse than none, because they make the picture lie.</p>\n<h2>Next</h2>\n<p><a href=\"#what-okflify-renders\" data-nav=\"what-okflify-renders\">what-okflify-renders</a> \u00b7 and the learning this cost:</p>\n<p><a href=\"#links-are-the-product\" data-nav=\"links-are-the-product\">links-are-the-product</a>.</p>", "src": "## The rule\n\nBundles live in folders, so every renderer reaches for a folder tree. That throws\naway the actual structure: **concepts connect through ordinary markdown links**,\nand the resulting network is richer than any parent-child path.\n\n```mermaid\nflowchart LR\n  I[\"index\"] --> B[\"what-is-a-bundle\"]\n  I --> T[\"trust-tiers\"]\n  I --> G[\"graph-not-tree\"]\n  I --> R[\"what-okflify-renders\"]\n  B --> G\n  G --> R\n  T --> L[\"links-are-the-product\"]\n  R --> T\n  L --> G\n```\n\nSame six files. The tree says *\"four things in a folder called concepts.\"* The\ngraph says *what depends on what.*\n\n## Both views, because both are true\n\nokflify ships **Knowledge graph** and **Tree** side by side. The graph is the\nsemantics; the tree is what you can navigate once a catalogue passes ~50\ndocuments. Neither replaces the other, and pretending the tree is the meaning is\nthe mistake this rule exists to prevent.\n\n## The uncomfortable corollary\n\n**If a bundle has no cross-links, okflify shows you a star** \u2014 every edge leaving\n`index.md`, nothing between concepts. A star is not a graph, and no amount of\nforce-directed physics makes it one.\n\nokflify warns on stderr when a multi-document bundle has zero edges. It is\nsupposed to be uncomfortable: a star means the concepts were written as chapters,\nnot as claims that depend on each other.\n\n## Counter-cases\n\n- Small bundles are legitimately star-shaped. Four documents do not owe you a\n  network. The warning is about 30-document bundles that are still stars.\n- A dense graph is not automatically good \u2014 links added to look connected are\n  worse than none, because they make the picture lie.\n\n## Next\n\n[what-okflify-renders](what-okflify-renders.md) \u00b7 and the learning this cost:\n[links-are-the-product](../learnings/links-are-the-product.md).\n", "out": ["links-are-the-product", "what-okflify-renders"], "in": ["index", "what-is-a-bundle"]}, {"slug": "trust-tiers", "bundle": "", "group": "Concepts", "section": "Concepts", "file": "concepts/trust-tiers.md", "title": "human > job > agent \u2014 and an agent-only claim says so, loudly", "type": "rule", "status": "", "tags": "[okf, trust, verification]", "verified": {"by": "human:daniel", "at": "2026-07-29", "method": "the weighting is Daniel's operating rule for the ARP catalogue and is enforced in okflify's renderer"}, "html": "<h2>The rule</h2>\n<div class='tw'><table><thead><tr><th>Tier</th><th>Means</th><th>Weight</th></tr></thead><tbody><tr><td><code>human:daniel</code></td><td>A person checked it against reality</td><td>Highest</td></tr><tr><td><code>job:pytest</code></td><td>A repeatable check passed</td><td>Middle</td></tr><tr><td><code>agent:claude</code></td><td>A model asserted it</td><td><strong>Lowest</strong></td></tr></tbody></table></div>\n<p>okflify renders the tier at the top of every document, colours the graph node by</p>\n<p>it, and prints a warning on agent-only pages:</p>\n<div class=\"cal cal-note\"><span class=\"ci\" data-i=\"info\"></span><div><p><strong>Agent-verified.</strong> Under OKF v0.2 weighting treat as unverified for</p><p>gate-shaped decisions.</p></div></div>\n<h2>Why this is the whole point</h2>\n<p>Knowledge bases fail in one specific way: everything in them **looks equally</p>\n<p>true**. A confident paragraph an agent produced in four seconds renders exactly</p>\n<p>like a number a human checked against a bank statement.</p>\n<p>Trust tiers make the difference visible without anyone opening frontmatter. That</p>\n<p>is the entire feature. A renderer that shows agent output as confidently as human</p>\n<p>verification is not a neutral choice \u2014 it is a bug.</p>\n<h2>What good <code>method</code> looks like</h2>\n<div class='tw'><table><thead><tr><th>Weak</th><th>Strong</th></tr></thead><tbody><tr><td>&quot;reviewed&quot;</td><td>&quot;reverted the fix and confirmed the test fails against the original&quot;</td></tr><tr><td>&quot;checked the docs&quot;</td><td>&quot;unauthenticated HEAD returned 200 with a private-bucket control returning 400&quot;</td></tr><tr><td>&quot;verified&quot;</td><td>&quot;<code>vercel projects ls --scope \u2026</code> lists it; the ingestor is absent&quot;</td></tr></tbody></table></div>\n<p>The strong column shares a property: <strong>someone else could run it and disagree.</strong></p>\n<h2>Counter-cases</h2>\n<ul><li><code>job:</code> outranking <code>agent:</code> assumes the job asserts something real. A test that</li></ul>\n<p>  cannot fail is agent-tier wearing a badge.</p>\n<ul><li><code>human:</code> is not infallible \u2014 it is accountable. Different thing, still better.</li><li>Tiers describe <strong>how</strong> a claim was checked, never how important it is.</li></ul>\n<h2>Next</h2>\n<p><code>stale_after</code> is the unglamorous companion. A human-verified claim about a live</p>\n<p>system decays; the date says when to look again.</p>", "src": "## The rule\n\n| Tier | Means | Weight |\n|------|-------|--------|\n| `human:daniel` | A person checked it against reality | Highest |\n| `job:pytest` | A repeatable check passed | Middle |\n| `agent:claude` | A model asserted it | **Lowest** |\n\nokflify renders the tier at the top of every document, colours the graph node by\nit, and prints a warning on agent-only pages:\n\n> **Agent-verified.** Under OKF v0.2 weighting treat as unverified for\n> gate-shaped decisions.\n\n## Why this is the whole point\n\nKnowledge bases fail in one specific way: everything in them **looks equally\ntrue**. A confident paragraph an agent produced in four seconds renders exactly\nlike a number a human checked against a bank statement.\n\nTrust tiers make the difference visible without anyone opening frontmatter. That\nis the entire feature. A renderer that shows agent output as confidently as human\nverification is not a neutral choice \u2014 it is a bug.\n\n## What good `method` looks like\n\n| Weak | Strong |\n|---|---|\n| \"reviewed\" | \"reverted the fix and confirmed the test fails against the original\" |\n| \"checked the docs\" | \"unauthenticated HEAD returned 200 with a private-bucket control returning 400\" |\n| \"verified\" | \"`vercel projects ls --scope \u2026` lists it; the ingestor is absent\" |\n\nThe strong column shares a property: **someone else could run it and disagree.**\n\n## Counter-cases\n\n- `job:` outranking `agent:` assumes the job asserts something real. A test that\n  cannot fail is agent-tier wearing a badge.\n- `human:` is not infallible \u2014 it is accountable. Different thing, still better.\n- Tiers describe **how** a claim was checked, never how important it is.\n\n## Next\n\n`stale_after` is the unglamorous companion. A human-verified claim about a live\nsystem decays; the date says when to look again.\n", "out": [], "in": ["index", "what-is-a-bundle", "what-okflify-renders"]}, {"slug": "what-is-a-bundle", "bundle": "", "group": "Concepts", "section": "Concepts", "file": "concepts/what-is-a-bundle.md", "title": "A bundle is five parts, and three of them are optional", "type": "claim", "status": "", "tags": "[okf, structure]", "verified": {"by": "job:okflify-build", "at": "2026-07-29", "method": "the layout below is what okflify's discover() and collect() actually walk; if it were wrong this page would not render"}, "html": "<h2>The layout</h2>\n<pre><code>bundle/\n  index.md          # required \u2014 the root: question, why, status, links\n  log.md            # append-only diary (no frontmatter by convention)\n  concepts/*.md     # claims, rules, questions \u2014 the substance\n  evidence/*.md     # pointers to what was actually observed\n  learnings/*.md    # promoted, re-verified, generalisable\n  docs.json         # optional theming</code></pre>\n<p>Only <code>index.md</code> is required. okflify skips what is absent \u2014 a bundle with one</p>\n<p>file is a valid bundle.</p>\n<h2>Frontmatter that matters</h2>\n<pre><code>---\nokf_version: &quot;0.2&quot;\ntype: claim          # claim | rule | learning | question | evidence-pointer | investigation\ntitle: &quot;One sentence someone could disagree with&quot;\nverified:\n  by: human:daniel   # human: &gt; job: &gt; agent:\n  at: 2026-07-29\n  method: &quot;how you checked \u2014 the part people skip&quot;\n  stale_after: 2026-10-01\n---</code></pre>\n<p><code>method</code> is the field that does the work. &quot;Verified&quot; without a method is a</p>\n<p>feeling. See <a href=\"#trust-tiers\" data-nav=\"trust-tiers\">trust-tiers</a>.</p>\n<h2>Body shape that holds up</h2>\n<p>Not enforced, but earned: **claim \u2192 evidence \u2192 counter-cases \u2192 open questions \u2192</p>\n<p>next experiment.** The counter-cases section is the one that separates a note from</p>\n<p>a claim. If you cannot name a case where you would be wrong, you have written an</p>\n<p>opinion.</p>\n<h2>Counter-cases</h2>\n<ul><li>A registry \u2014 &quot;where does X live?&quot; \u2014 is <em>not</em> a bundle. Trust tiers on a URL are</li></ul>\n<p>  noise. Keep catalogs as structured data with a schema.</p>\n<ul><li>A bundle per meeting produces sprawl. One bundle per **question you expect to</li></ul>\n<p>  re-learn in 30 days**.</p>\n<h2>Next</h2>\n<p>Read <a href=\"#graph-not-tree\" data-nav=\"graph-not-tree\">graph-not-tree</a> \u2014 the layout above is storage, not structure.</p>", "src": "## The layout\n\n```\nbundle/\n  index.md          # required \u2014 the root: question, why, status, links\n  log.md            # append-only diary (no frontmatter by convention)\n  concepts/*.md     # claims, rules, questions \u2014 the substance\n  evidence/*.md     # pointers to what was actually observed\n  learnings/*.md    # promoted, re-verified, generalisable\n  docs.json         # optional theming\n```\n\nOnly `index.md` is required. okflify skips what is absent \u2014 a bundle with one\nfile is a valid bundle.\n\n## Frontmatter that matters\n\n```yaml\n---\nokf_version: \"0.2\"\ntype: claim          # claim | rule | learning | question | evidence-pointer | investigation\ntitle: \"One sentence someone could disagree with\"\nverified:\n  by: human:daniel   # human: > job: > agent:\n  at: 2026-07-29\n  method: \"how you checked \u2014 the part people skip\"\n  stale_after: 2026-10-01\n---\n```\n\n`method` is the field that does the work. \"Verified\" without a method is a\nfeeling. See [trust-tiers](trust-tiers.md).\n\n## Body shape that holds up\n\nNot enforced, but earned: **claim \u2192 evidence \u2192 counter-cases \u2192 open questions \u2192\nnext experiment.** The counter-cases section is the one that separates a note from\na claim. If you cannot name a case where you would be wrong, you have written an\nopinion.\n\n## Counter-cases\n\n- A registry \u2014 \"where does X live?\" \u2014 is *not* a bundle. Trust tiers on a URL are\n  noise. Keep catalogs as structured data with a schema.\n- A bundle per meeting produces sprawl. One bundle per **question you expect to\n  re-learn in 30 days**.\n\n## Next\n\nRead [graph-not-tree](graph-not-tree.md) \u2014 the layout above is storage, not structure.\n", "out": ["graph-not-tree", "trust-tiers"], "in": ["index"]}, {"slug": "what-okflify-renders", "bundle": "", "group": "Concepts", "section": "Concepts", "file": "concepts/what-okflify-renders.md", "title": "What okflify renders, and how to reach each part", "type": "claim", "status": "", "tags": "[okflify, features]", "verified": {"by": "job:okflify-build", "at": "2026-07-29", "method": "every row below is exercised by the page you are reading; a broken feature breaks this page"}, "html": "<h2>One command</h2>\n<pre><code>okflify &lt;bundle-or-catalogue&gt; --open</code></pre>\n<p>Output is <strong>one self-contained HTML file</strong>. No server, no build step, no</p>\n<p>dependencies \u2014 it opens from <code>file://</code>, survives email, and prints.</p>\n<h2>What you get</h2>\n<div class='tw'><table><thead><tr><th>Feature</th><th>Where</th><th>Note</th></tr></thead><tbody><tr><td><strong>Trust card</strong></td><td>top of every document</td><td>tier, date, method, staleness, agent warning</td></tr><tr><td><strong>Knowledge graph</strong></td><td>sidebar \u2192 Overview</td><td>drag nodes, click to open; size = inbound links, colour = tier</td></tr><tr><td><strong>Tree</strong></td><td>sidebar \u2192 Overview</td><td>bundle \u2192 section \u2192 document, collapsible</td></tr><tr><td><strong>Backlinks</strong></td><td>foot of each document</td><td>&quot;links to&quot; / &quot;linked from&quot; as cards</td></tr><tr><td><strong>\u2318K palette</strong></td><td>anywhere</td><td>indexes documents <strong>and</strong> every h2/h3</td></tr><tr><td><strong>Copy page</strong></td><td>title row</td><td>Markdown for LLMs \u00b7 open in Claude/ChatGPT \u00b7 copy whole bundle</td></tr><tr><td><strong>Diagram surfing</strong></td><td>click any diagram</td><td>scroll zooms at cursor, drag or space+drag pans, <code>0</code> fit, <code>1</code> actual, <code>esc</code></td></tr><tr><td><strong>Theme</strong></td><td>header</td><td>light/dark; diagrams re-render to match</td></tr><tr><td><strong>Print</strong></td><td>header</td><td>every document, page-broken</td></tr></tbody></table></div>\n<h2>Catalogues</h2>\n<p>Point it at a directory of bundles \u2014 <code>root/bundles/&lt;slug&gt;/</code> or <code>root/&lt;slug&gt;/</code> \u2014</p>\n<p>and it renders them as one site. Slugs are namespaced <code>&lt;bundle&gt;/&lt;doc&gt;</code>, so</p>\n<p><code>../other-bundle/index.md</code> becomes a real cross-bundle edge, and the sidebar</p>\n<p>groups by bundle.</p>\n<p>The ARP catalogue it was built for: <strong>18 bundles, 102 documents, 88 edges.</strong></p>\n<h2>Theming</h2>\n<p><code>docs.json</code>, Mintlify-shaped. Never edit the template to restyle.</p>\n<pre><code>{ &quot;name&quot;: &quot;My Knowledge&quot;,\n  &quot;colors&quot;: { &quot;primary&quot;: &quot;#2E6F5E&quot;, &quot;light&quot;: &quot;#6FC7AC&quot;, &quot;dark&quot;: &quot;#1F5044&quot; },\n  &quot;fonts&quot;: { &quot;family&quot;: &quot;Inter&quot; },\n  &quot;background&quot;: { &quot;decoration&quot;: &quot;gradient&quot; } }</code></pre>\n<p>Any Google Font name loads automatically.</p>\n<h2>Counter-cases</h2>\n<ul><li>Not an editor. okflify reads; something else writes.</li><li>Not a general markdown renderer \u2014 it renders what bundles contain.</li><li>Mermaid loads from a CDN at view time, so diagrams need network on first paint.</li></ul>\n<h2>Known gaps</h2>\n<p>Stated because <a href=\"#trust-tiers\" data-nav=\"trust-tiers\">trust-tiers</a> makes overselling a bug:</p>\n<ul><li>No arrowheads on graph edges \u2014 direction is invisible</li><li>Layout re-seeds per visit rather than staying stable</li><li>No full-text search across document <em>bodies</em> (titles and headings only)</li></ul>", "src": "## One command\n\n```sh\nokflify <bundle-or-catalogue> --open\n```\n\nOutput is **one self-contained HTML file**. No server, no build step, no\ndependencies \u2014 it opens from `file://`, survives email, and prints.\n\n## What you get\n\n| Feature | Where | Note |\n|---|---|---|\n| **Trust card** | top of every document | tier, date, method, staleness, agent warning |\n| **Knowledge graph** | sidebar \u2192 Overview | drag nodes, click to open; size = inbound links, colour = tier |\n| **Tree** | sidebar \u2192 Overview | bundle \u2192 section \u2192 document, collapsible |\n| **Backlinks** | foot of each document | \"links to\" / \"linked from\" as cards |\n| **\u2318K palette** | anywhere | indexes documents **and** every h2/h3 |\n| **Copy page** | title row | Markdown for LLMs \u00b7 open in Claude/ChatGPT \u00b7 copy whole bundle |\n| **Diagram surfing** | click any diagram | scroll zooms at cursor, drag or space+drag pans, `0` fit, `1` actual, `esc` |\n| **Theme** | header | light/dark; diagrams re-render to match |\n| **Print** | header | every document, page-broken |\n\n## Catalogues\n\nPoint it at a directory of bundles \u2014 `root/bundles/<slug>/` or `root/<slug>/` \u2014\nand it renders them as one site. Slugs are namespaced `<bundle>/<doc>`, so\n`../other-bundle/index.md` becomes a real cross-bundle edge, and the sidebar\ngroups by bundle.\n\nThe ARP catalogue it was built for: **18 bundles, 102 documents, 88 edges.**\n\n## Theming\n\n`docs.json`, Mintlify-shaped. Never edit the template to restyle.\n\n```json\n{ \"name\": \"My Knowledge\",\n  \"colors\": { \"primary\": \"#2E6F5E\", \"light\": \"#6FC7AC\", \"dark\": \"#1F5044\" },\n  \"fonts\": { \"family\": \"Inter\" },\n  \"background\": { \"decoration\": \"gradient\" } }\n```\n\nAny Google Font name loads automatically.\n\n## Counter-cases\n\n- Not an editor. okflify reads; something else writes.\n- Not a general markdown renderer \u2014 it renders what bundles contain.\n- Mermaid loads from a CDN at view time, so diagrams need network on first paint.\n\n## Known gaps\n\nStated because [trust-tiers](trust-tiers.md) makes overselling a bug:\n\n- No arrowheads on graph edges \u2014 direction is invisible\n- Layout re-seeds per visit rather than staying stable\n- No full-text search across document *bodies* (titles and headings only)\n", "out": ["trust-tiers"], "in": ["graph-not-tree", "index"]}, {"slug": "build-output", "bundle": "", "group": "Evidence", "section": "Evidence", "file": "evidence/build-output.md", "title": "Build output \u2014 what this bundle produces", "type": "evidence-pointer", "status": "", "tags": "[okflify, evidence]", "verified": {"by": "job:okflify-build", "at": "2026-07-29", "method": "captured from `okflify example` on the commit that ships this bundle"}, "html": "<h2>Command</h2>\n<pre><code>$ okflify example\nokflify \u2192 example/okflify.html \u2014 8 documents, 12 edges, 1 diagrams</code></pre>\n<h2>What that means</h2>\n<div class='tw'><table><thead><tr><th>Number</th><th>Reading</th></tr></thead><tbody><tr><td><strong>8 documents</strong></td><td>index + log + 4 concepts + 1 learning + 1 evidence</td></tr><tr><td><strong>12 edges</strong></td><td>markdown links between them \u2014 <strong>6 of 12 originate outside the index</strong></td></tr><tr><td><strong>density 0.43</strong></td><td>vs 0.19 for the star described in <a href=\"#links-are-the-product\" data-nav=\"links-are-the-product\">links-are-the-product</a></td></tr><tr><td><strong>1 diagram</strong></td><td>the mermaid graph in <code>graph-not-tree</code></td></tr></tbody></table></div>\n<p>The middle number is the one that matters. A star of 8 documents would show 7</p>\n<p>edges, all from the index, and density 0.25. See <a href=\"#links-are-the-product\" data-nav=\"links-are-the-product\">links-are-the-product</a>.</p>\n<h2>A correction worth keeping</h2>\n<p>The first draft of this page claimed 7 documents and 12 edges. The build said 8</p>\n<p>and 10. Both numbers were wrong, and chasing the gap exposed a real bug: okflify</p>\n<p>treated <code>../learnings/x.md</code> (a section hop inside one bundle) as a bundle hop,</p>\n<p>silently dropping two edges.</p>\n<p>Invented numbers on an evidence page would have hidden a renderer bug. That is</p>\n<p>the argument for <code>method:</code> in one paragraph.</p>\n<h2>Reproduce</h2>\n<pre><code>git clone https://github.com/eidos-agi/okflify &amp;&amp; cd okflify\npip install -e .\nokflify example --open</code></pre>\n<p>If the counts differ from the table above, this page is stale \u2014 which is the</p>\n<p>point of recording them.</p>", "src": "## Command\n\n```sh\n$ okflify example\nokflify \u2192 example/okflify.html \u2014 8 documents, 12 edges, 1 diagrams\n```\n\n## What that means\n\n| Number | Reading |\n|---|---|\n| **8 documents** | index + log + 4 concepts + 1 learning + 1 evidence |\n| **12 edges** | markdown links between them \u2014 **6 of 12 originate outside the index** |\n| **density 0.43** | vs 0.19 for the star described in [links-are-the-product](../learnings/links-are-the-product.md) |\n| **1 diagram** | the mermaid graph in `graph-not-tree` |\n\nThe middle number is the one that matters. A star of 8 documents would show 7\nedges, all from the index, and density 0.25. See [links-are-the-product](../learnings/links-are-the-product.md).\n\n## A correction worth keeping\n\nThe first draft of this page claimed 7 documents and 12 edges. The build said 8\nand 10. Both numbers were wrong, and chasing the gap exposed a real bug: okflify\ntreated `../learnings/x.md` (a section hop inside one bundle) as a bundle hop,\nsilently dropping two edges.\n\nInvented numbers on an evidence page would have hidden a renderer bug. That is\nthe argument for `method:` in one paragraph.\n\n## Reproduce\n\n```sh\ngit clone https://github.com/eidos-agi/okflify && cd okflify\npip install -e .\nokflify example --open\n```\n\nIf the counts differ from the table above, this page is stale \u2014 which is the\npoint of recording them.\n", "out": ["links-are-the-product"], "in": ["index"]}, {"slug": "links-are-the-product", "bundle": "", "group": "Learnings", "section": "Learnings", "file": "learnings/links-are-the-product.md", "title": "A renderer cannot fix a bundle with nothing to render", "type": "learning", "status": "", "tags": "[okf, graph, method]", "verified": {"by": "human:daniel", "at": "2026-07-29", "method": "observed directly: the first real bundle rendered a star, and Daniel said the graph tool was bad before the bundle was diagnosed", "stale_after": "2027-01-01"}, "html": "<h2>The learning</h2>\n<p><strong>The graph view is only as good as the links the author wrote.</strong></p>\n<p>okflify&#x27;s first real bundle \u2014 nine documents about a platform architecture \u2014</p>\n<p>rendered as a <strong>star</strong>: all seven edges leaving <code>index.md</code>, no concept linking to</p>\n<p>any other, one document orphaned entirely. Density 0.19.</p>\n<p>The reasonable reaction was <em>&quot;this is a bad graph tool.&quot;</em> It was not. It was an</p>\n<p>honest picture of a bundle written as <strong>chapters</strong> \u2014 00, 01, 02 \u2014 rather than as</p>\n<p>claims that depend on each other.</p>\n<p>The next bundle, written with cross-links deliberately, came out at **18 edges</p>\n<p>across 8 documents, density 0.64, 12 of 18 originating outside the index**. Same</p>\n<p>renderer. Different authoring.</p>\n<h2>Why it generalises</h2>\n<p>Any visualisation inherits its subject&#x27;s quality. A force-directed layout of a</p>\n<p>hierarchy is strictly worse than a list: same information, plus jitter.</p>\n<p>The tempting fix is renderer features \u2014 arrowheads, clustering, better physics.</p>\n<p>None of them create a relationship that the author did not write down.</p>\n<h2>What to do instead</h2>\n<ul><li>Write concepts that <strong>cite each other</strong>: a rule should link the claim it rests on</li><li>Link <strong>counter-cases across bundles</strong> \u2014 that is where the real edges live</li><li>Treat okflify&#x27;s zero-edge warning as a <strong>content</strong> signal, not a bug report</li><li>Judge a bundle by whether edges originate <strong>outside the index</strong></li></ul>\n<h2>Counter-cases</h2>\n<ul><li>Small bundles are legitimately star-shaped; four documents owe you nothing.</li><li>Density can be gamed. Links added to look connected are worse than absent ones,</li></ul>\n<p>  because the picture then lies with confidence.</p>\n<ul><li>Some knowledge really is hierarchical \u2014 a runbook is a sequence. Use the tree.</li></ul>\n<h2>Re-verify</h2>\n<p>When a catalogue passes ~50 documents. If density has fallen while document count</p>\n<p>rose, bundles are being written in isolation again.</p>", "src": "## The learning\n\n**The graph view is only as good as the links the author wrote.**\n\nokflify's first real bundle \u2014 nine documents about a platform architecture \u2014\nrendered as a **star**: all seven edges leaving `index.md`, no concept linking to\nany other, one document orphaned entirely. Density 0.19.\n\nThe reasonable reaction was *\"this is a bad graph tool.\"* It was not. It was an\nhonest picture of a bundle written as **chapters** \u2014 00, 01, 02 \u2014 rather than as\nclaims that depend on each other.\n\nThe next bundle, written with cross-links deliberately, came out at **18 edges\nacross 8 documents, density 0.64, 12 of 18 originating outside the index**. Same\nrenderer. Different authoring.\n\n## Why it generalises\n\nAny visualisation inherits its subject's quality. A force-directed layout of a\nhierarchy is strictly worse than a list: same information, plus jitter.\n\nThe tempting fix is renderer features \u2014 arrowheads, clustering, better physics.\nNone of them create a relationship that the author did not write down.\n\n## What to do instead\n\n- Write concepts that **cite each other**: a rule should link the claim it rests on\n- Link **counter-cases across bundles** \u2014 that is where the real edges live\n- Treat okflify's zero-edge warning as a **content** signal, not a bug report\n- Judge a bundle by whether edges originate **outside the index**\n\n## Counter-cases\n\n- Small bundles are legitimately star-shaped; four documents owe you nothing.\n- Density can be gamed. Links added to look connected are worse than absent ones,\n  because the picture then lies with confidence.\n- Some knowledge really is hierarchical \u2014 a runbook is a sequence. Use the tree.\n\n## Re-verify\n\nWhen a catalogue passes ~50 documents. If density has fallen while document count\nrose, bundles are being written in isolation again.\n", "out": [], "in": ["build-output", "graph-not-tree", "index"]}],EDGES=[{"s": "index", "t": "what-is-a-bundle"}, {"s": "index", "t": "trust-tiers"}, {"s": "index", "t": "graph-not-tree"}, {"s": "index", "t": "what-okflify-renders"}, {"s": "index", "t": "links-are-the-product"}, {"s": "index", "t": "build-output"}, {"s": "graph-not-tree", "t": "what-okflify-renders"}, {"s": "graph-not-tree", "t": "links-are-the-product"}, {"s": "what-is-a-bundle", "t": "trust-tiers"}, {"s": "what-is-a-bundle", "t": "graph-not-tree"}, {"s": "what-okflify-renders", "t": "trust-tiers"}, {"s": "build-output", "t": "links-are-the-product"}],EYEBROW="section";

 if(typeof resetMermaid==="function")resetMermaid();else R.clear();

function nav(f=""){const q=f.toLowerCase();
 let h=`<div class="sec">${svg(GI.Overview,15)}Overview</div><a class="n" href="#graph" data-nav="graph">Knowledge graph</a><a class="n" href="#tree" data-nav="tree">Tree</a>`;

   hits+=it.length;if(!it.length)return"";
   return `<div class="sec">${svg(GI[g.n]||"layers",15)}${g.n}</div>`+

document.getElementById("body").innerHTML=DOCS.map(d=>{
 const v=d.verified||{},t=tier(v.by);
 const fl=t==="agent"?`<div class="fl"><strong>Agent-verified.</strong> Under OKF v0.2 weighting (human &gt; job &gt; agent) treat as unverified for gate-shaped decisions.</div>`:"";
 const tr=v.by?`<div class="trust"><div class="hd"><span class="dot ${t}"></span>${esc(v.by)} · ${d.type}</div><dl>
   <dt>verified</dt><dd>${esc(v.at||"—")}</dd><dt>method</dt><dd>${esc(v.method||"—")}</dd>

   else if(k==="-"||k==="_"){zoomAt(1/1.25,innerWidth/2,innerHeight/2,true);e.preventDefault()}
   else if(k==="0"){fit();e.preventDefault()}
   else if(k==="1"){const f=1/base;zoomAt(f*base/sc*base,innerWidth/2,innerHeight/2,true);sc=1*base/base;sc=1;apply(true);e.preventDefault()}
   else if(k.startsWith("Arrow")){const d=e.shiftKey?110:36;
     if(k==="ArrowUp")ty+=d;if(k==="ArrowDown")ty-=d;if(k==="ArrowLeft")tx+=d;if(k==="ArrowRight")tx-=d;
     apply(true);e.preventDefault()}
 });
 addEventListener("keyup",e=>{if(e.key===" "){spc=false;stage.classList.remove("grab")}});
 addEventListener("resize",()=>{if(lb.classList.contains("on"))fit(false)});
 lb.querySelector("#lbbar").addEventListener("click",e=>{
   const b=e.target.closest("[data-z]");if(!b)return;const z=b.dataset.z;
   if(z==="in")zoomAt(1.25,innerWidth/2,innerHeight/2,true);
   else if(z==="out")zoomAt(1/1.25,innerWidth/2,innerHeight/2,true);
   else if(z==="fit")fit();
   else{sc=1;tx=0;ty=0;apply(true)}});
})();

</script></body></html>
